name: Refresh official skill packages
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'
permissions:
  contents: write
concurrency:
  group: skill-source-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 -m unittest
      - run: python3 sync.py
      - name: Commit only generated public skills
        run: |
          git add -- skills/graphify skills/skill-vetter
          if git diff --staged --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh verified upstream skills'
          git push
